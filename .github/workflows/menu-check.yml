name: Vérifier le site et préparer le menu
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la cohérence du menu et les outils
        run: |
          python scripts/menu_data.py --check
          node --test tests/agent-tools.test.cjs
